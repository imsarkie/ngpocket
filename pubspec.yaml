name: reader
description: "A premium read-later and RSS reader Flutter application."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.9.0
  dart_rss: ^3.0.3
  receive_sharing_intent: ^1.8.1
  flutter_card_swiper: ^7.1.0
  google_fonts: ^6.3.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  html: ^0.15.6
  url_launcher: ^6.3.1
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^17.2.3
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.8.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/reader_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ECE7DF"
  adaptive_icon_foreground: "assets/branding/reader_icon.png"

flutter_native_splash:
  color: "#ECE7DF"
  android: true
  ios: true
  web: true
  android_12:
    color: "#ECE7DF"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/reader_icon.png
